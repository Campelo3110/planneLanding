<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Planne - Account</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f8fafc">
    <script>try{const t=localStorage.getItem('planne-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

    <script type="module" src="/assets/js/auth-action-app.js"></script>
    <link rel="stylesheet" href="/assets/css/auth-action.css">
<link rel="stylesheet" href="/assets/css/utility-pages.css">
</head>

<body>

<div class="bg-blobs" aria-hidden="true">
    <span class="blob-1"></span>
    <span class="blob-2"></span>
</div>

<header>
    <a href="/" class="logo-link" aria-label="Planne">
        <img src="/assets/brand/logo-64x64.png" alt="" width="36" height="36">
        <span class="logo-text">Planne</span>
    </a>
    <div class="header-actions">
        <div class="lang-switcher" role="group" aria-label="Language / Idioma">
            <button id="btn-pt" onclick="setLang('pt')">PT</button>
            <span class="lang-sep" aria-hidden="true">|</span>
            <button id="btn-en" onclick="setLang('en')">EN</button>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">
            <svg id="theme-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </div>
</header>

<main>
<div class="card">

    <!-- ══════════════════════════════════
         LOADING (initial check)
    ══════════════════════════════════ -->
    <div class="state-centered active" id="stateLoading">
        <div class="loading-pulse">
            <div class="pulse-ring"></div>
            <p style="font-size:14px;color:var(--muted)" data-i18n="loading"></p>
        </div>
    </div>

    <!-- ══════════════════════════════════
         RESET PASSWORD — form
    ══════════════════════════════════ -->
    <div class="state" id="stateReset">
        <div class="card-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1 class="card-title"    data-i18n="resetTitle"></h1>
        <p  class="card-subtitle" data-i18n="resetSubtitle"></p>

        <div class="msg msg-error" id="resetError" role="alert">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="resetErrorText"></span>
        </div>

        <div class="field">
            <label for="newPassword" data-i18n="labelNew"></label>
            <div class="input-wrap">
                <input type="password" id="newPassword" autocomplete="new-password"
                       oninput="evalStrength(this.value)"
                       data-i18n-placeholder="placeholderNew">
                <button type="button" class="toggle-pw" onclick="togglePw('newPassword',this)" tabindex="-1">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div class="strength-bar"><span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span></div>
            <p class="strength-label" id="strengthLabel"></p>
        </div>

        <div class="field">
            <label for="confirmPassword" data-i18n="labelConfirm"></label>
            <div class="input-wrap">
                <input type="password" id="confirmPassword" autocomplete="new-password"
                       data-i18n-placeholder="placeholderConfirm">
                <button type="button" class="toggle-pw" onclick="togglePw('confirmPassword',this)" tabindex="-1">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </div>

        <button class="btn-primary" id="submitBtn" onclick="handleReset()">
            <div class="spinner" id="spinner"></div>
            <span id="btnText"></span>
            <svg id="btnIcon" viewBox="0 0 24 24" style="width:16px;height:16px;stroke:#fff;stroke-width:2;fill:none"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

        <div class="cooldown-wrap" id="cooldownWrap"><div class="cooldown-bar" id="cooldownBar"></div></div>
        <div class="divider" data-i18n="secure"></div>
    </div>

    <!-- ══════════════════════════════════
         VERIFY EMAIL — auto apply
    ══════════════════════════════════ -->
    <div class="state-centered" id="stateVerify">
        <div class="loading-pulse" id="verifyLoading">
            <div class="pulse-ring"></div>
            <p style="font-size:14px;color:var(--muted)" data-i18n="verifying"></p>
        </div>
        <div id="verifyResult" style="display:none;flex-direction:column;align-items:center;text-align:center;">
            <div class="state-icon icon-success" id="verifyIcon">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <p class="state-title" id="verifyTitle"></p>
            <p class="state-sub"   id="verifySub"></p>
            <a href="planne://planne.com" class="btn-secondary" onclick="handleBackToApp()">
                <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span data-i18n="backHome"></span>
            </a>
        </div>
    </div>

    <!-- ══════════════════════════════════
         RECOVER EMAIL — auto apply
    ══════════════════════════════════ -->
    <div class="state-centered" id="stateRecover">
        <div class="loading-pulse" id="recoverLoading">
            <div class="pulse-ring"></div>
            <p style="font-size:14px;color:var(--muted)" data-i18n="recovering"></p>
        </div>
        <div id="recoverResult" style="display:none;flex-direction:column;align-items:center;text-align:center;">
            <div class="state-icon icon-warning" id="recoverIcon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
            <p class="state-title" id="recoverTitle"></p>
            <p class="state-sub"   id="recoverSub"></p>
            <a href="planne://planne.com" class="btn-secondary" onclick="handleBackToApp()">
                <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <span data-i18n="backHome"></span>
            </a>
        </div>
    </div>

    <!-- ══════════════════════════════════
         RESET SUCCESS
    ══════════════════════════════════ -->
    <div class="state-centered" id="stateResetSuccess">
        <div class="state-icon icon-success">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="state-title" data-i18n="resetSuccessTitle"></p>
        <p class="state-sub"   data-i18n="resetSuccessSub"></p>
        <a href="planne://planne.com" class="btn-secondary" onclick="handleBackToApp()">
            <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span data-i18n="backHome"></span>
        </a>
    </div>

    <!-- ══════════════════════════════════
         INVALID / EXPIRED
    ══════════════════════════════════ -->
    <div class="state-centered" id="stateInvalid">
        <div class="state-icon icon-error">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <p class="state-title" data-i18n="invalidTitle"></p>
        <p class="state-sub"   id="invalidSub"></p>
        <a href="planne://planne.com" class="btn-secondary" onclick="handleBackToApp()">
            <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span data-i18n="backHome"></span>
        </a>
    </div>

</div>
</main>

<footer>
    <p>&copy; 2026 Planne &nbsp;·&nbsp; <a href="/privacy.html" data-i18n="privacy"></a> &nbsp;·&nbsp; <a href="/terms.html" data-i18n="terms"></a></p>
</footer>

<script src="/assets/js/auth-action.js"></script>
</body>
</html>
