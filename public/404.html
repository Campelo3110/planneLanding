<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagina nao encontrada - Planne</title>
    <style>
      :root { color-scheme: light; --bg: #f8fafc; --text: #1e293b; --muted: #64748b; --primary: #13b8a7; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
      main { width: min(420px, calc(100% - 32px)); text-align: center; }
      h1 { margin: 0; font-size: 3rem; line-height: 1; }
      p { margin: 16px 0 24px; color: var(--muted); }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; border-radius: 999px; background: var(--primary); color: #fff; padding: 0 20px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Essa pagina nao existe ou foi movida.</p>
      <a href="/">Voltar para a Planne</a>
    </main>
  </body>
</html>
