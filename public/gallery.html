<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#133d37">
  <title>Planne · Event camera</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32x32.png">
  <link rel="stylesheet" href="/assets/css/gallery.css?v=20260919-disposable-camera">
  <style>[hidden]{display:none!important}</style>
  <script type="module" src="/assets/js/app-check.js"></script>
</head>
<body>
  <main class="camera-page" aria-live="polite">
    <section class="camera-app" aria-labelledby="pageTitle">
      <header class="app-bar">
        <a class="brand" href="https://planneapp.com" aria-label="Planne"><img src="/assets/brand/logo-64x64.png" width="30" height="30" alt=""><span>Planne</span></a>
        <p id="albumLabel">EVENT ALBUM</p>
      </header>
      <section class="camera-device" aria-describedby="cameraHint">
        <div class="device-label"><span>PLN · 27</span><span class="record-dot" aria-hidden="true"></span><span id="singlePhotoLabel">ONE PHOTO</span></div>
        <section class="camera-stage" id="cameraStage">
          <video id="cameraVideo" autoplay muted playsinline></video><canvas id="captureCanvas" hidden></canvas>
          <div class="camera-placeholder" id="cameraPlaceholder">
            <span class="camera-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.3-2h7.4l1.3 2h3A1.5 1.5 0 0 1 21.5 10v8.5A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5V10A1.5 1.5 0 0 1 4 8.5Z"/><circle cx="12" cy="14" r="3.4"/></svg></span>
            <h1 id="pageTitle">Keep this moment</h1><p id="cameraHint">Open the camera or choose a photo for the album.</p><button class="start-camera" id="startCameraBtn" type="button">Turn on camera</button>
          </div>
          <div class="viewfinder" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="camera-scrim" aria-hidden="true"></div>
          <div class="camera-status" id="cameraStatus" hidden><span></span><span id="cameraStatusText">CAMERA READY</span></div>
          <button class="switch-camera" id="switchCameraBtn" type="button" hidden aria-label="Trocar câmera"><svg viewBox="0 0 24 24"><path d="M7 7h10l-2-2m2 2-2 2M17 17H7l2 2m-2-2 2-2"/><path d="M19 7a7 7 0 0 0-12-2M5 17a7 7 0 0 0 12 2"/></svg></button>
        </section>
        <section class="control-deck" aria-label="Controles da câmera">
          <button class="source-button" id="chooseFileBtn" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.4"/><path d="m21 15-4.8-4.8L6 20"/></svg><span id="chooseFileLabel">Photo roll</span></button>
          <div class="shutter-wrap"><button class="shutter" id="captureBtn" type="button" disabled aria-label="Take photo"><span></span></button><p id="captureLabel">Turn on the camera</p></div>
          <span class="frame-count" aria-hidden="true">01<br><small id="photoCountLabel">photo</small></span>
        </section>
      </section>
      <p class="camera-note" id="cameraNote">Photos are available only to the host in the Planne app.</p>
    </section>
  </main>
  <input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
  <section class="review" id="review" aria-modal="true" aria-labelledby="reviewTitle" role="dialog" hidden><div class="review-image-wrap"><img id="reviewImage" alt="Selected photo preview"></div><div class="review-panel"><div class="review-heading"><p id="reviewFilmLabel">PHOTO 01</p><h2 id="reviewTitle">Does it look good?</h2></div><label class="name-field" for="uploaderName"><span id="uploaderNameLabel">Your name</span><span id="uploaderNameOptional">optional</span><input id="uploaderName" type="text" maxlength="80" autocomplete="name" placeholder="To appear with the photo"></label><p class="form-error" id="formError" role="alert" hidden></p><div class="review-actions"><button class="secondary-action" id="retakeBtn" type="button">Retake</button><button class="send-action" id="submitBtn" type="button">Develop photo</button></div></div></section>
  <section class="result-card" id="resultCard" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden><div class="result-icon" aria-hidden="true"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="send-action" id="resultAction" type="button"></button></section>
  <script src="/assets/js/gallery.js?v=20260919-disposable-camera" defer></script>
</body>
</html>
