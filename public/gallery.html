<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#10211f">
  <title>Planne · Câmera do evento</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32x32.png">
  <link rel="stylesheet" href="/assets/css/gallery.css?v=20260919-camera">
  <style>[hidden]{display:none!important}</style>
  <script type="module" src="/assets/js/app-check.js"></script>
</head>
<body>
  <main class="camera-page" aria-live="polite">
    <section class="camera-shell" aria-labelledby="pageTitle">
      <header class="camera-header">
        <a class="brand" href="https://planneapp.com" aria-label="Planne"><img src="/assets/brand/logo-64x64.png" width="32" height="32" alt=""><span>Planne</span></a>
        <p class="camera-kicker">Álbum privado do evento</p>
      </header>
      <section class="camera-stage" id="cameraStage" aria-describedby="cameraHint">
        <video id="cameraVideo" autoplay muted playsinline></video><canvas id="captureCanvas" hidden></canvas>
        <div class="camera-placeholder" id="cameraPlaceholder">
          <span class="camera-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.3-2h7.4l1.3 2h3A1.5 1.5 0 0 1 21.5 10v8.5A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5V10A1.5 1.5 0 0 1 4 8.5Z"/><circle cx="12" cy="14" r="3.4"/></svg></span>
          <h1 id="pageTitle">Registre este momento</h1><p id="cameraHint">Use a câmera ou escolha uma foto para enviar ao álbum do evento.</p><button class="start-camera" id="startCameraBtn" type="button">Abrir câmera</button>
        </div>
        <div class="camera-scrim" aria-hidden="true"></div><div class="camera-status" id="cameraStatus" hidden><span></span>Câmera pronta</div>
        <button class="switch-camera" id="switchCameraBtn" type="button" hidden aria-label="Trocar câmera"><svg viewBox="0 0 24 24"><path d="M7 7h10l-2-2m2 2-2 2M17 17H7l2 2m-2-2 2-2"/><path d="M19 7a7 7 0 0 0-12-2M5 17a7 7 0 0 0 12 2"/></svg></button>
      </section>
      <section class="capture-controls" aria-label="Controles da câmera">
        <button class="source-button" id="chooseFileBtn" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.4"/><path d="m21 15-4.8-4.8L6 20"/></svg><span>Escolher foto</span></button>
        <button class="shutter" id="captureBtn" type="button" disabled aria-label="Tirar foto"><span></span></button><p class="capture-label" id="captureLabel">Ative a câmera para fotografar</p>
      </section>
      <p class="camera-note">As fotos enviadas ficam disponíveis somente para a organização no app Planne.</p>
    </section>
  </main>
  <input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
  <section class="review" id="review" aria-modal="true" aria-labelledby="reviewTitle" role="dialog" hidden>
    <div class="review-image-wrap"><img id="reviewImage" alt="Prévia da foto escolhida"></div>
    <div class="review-panel"><div class="review-heading"><p>Álbum privado</p><h2 id="reviewTitle">Sua foto está pronta?</h2></div><label class="name-field" for="uploaderName">Seu nome <span>opcional</span><input id="uploaderName" type="text" maxlength="80" autocomplete="name" placeholder="Para aparecer junto da foto"></label><p class="form-error" id="formError" role="alert" hidden></p><div class="review-actions"><button class="secondary-action" id="retakeBtn" type="button">Refazer</button><button class="send-action" id="submitBtn" type="button">Enviar foto</button></div></div>
  </section>
  <section class="result-card" id="resultCard" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden><div class="result-icon" aria-hidden="true"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="send-action" id="resultAction" type="button"></button></section>
  <script src="/assets/js/gallery.js?v=20260919-camera" defer></script>
</body>
</html>
