<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#133d37">
  <title>Planne · Event camera</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32x32.png">
  <link rel="stylesheet" href="/assets/css/gallery.css?v=20260919-disposable-camera">
  <style>[hidden]{display:none!important}</style>
  <style>
    /* Camera app: preview primeiro; a referência analógica entra só nos detalhes. */
    .camera-page{padding:0;background:#080d0d;place-items:stretch}.camera-app{width:100%;max-width:none;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:#080d0d}.app-bar{padding:max(16px,env(safe-area-inset-top)) 20px 14px;color:#f5f2e9}.app-bar p{font-size:.68rem;color:#d7ddd1}.camera-device{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;padding:0;border:0;border-radius:0;background:#080d0d;box-shadow:none}.device-label{padding:0 20px 12px;color:#dfe8dc}.camera-stage{min-height:0;height:auto;border:0;border-radius:0;background:#101515;box-shadow:none}.camera-placeholder{background:#101515}.camera-placeholder h1{font:clamp(30px,5vw,48px)/1 PatuaOne,serif}.camera-scrim{background:linear-gradient(180deg,rgba(0,0,0,.52),transparent 20%,transparent 70%,rgba(0,0,0,.78))}.viewfinder{inset:0;background:linear-gradient(to right,transparent 33.15%,rgba(255,255,255,.2) 33.3%,rgba(255,255,255,.2) 33.48%,transparent 33.63%,transparent 66.35%,rgba(255,255,255,.2) 66.5%,rgba(255,255,255,.2) 66.68%,transparent 66.83%),linear-gradient(to bottom,transparent 33.15%,rgba(255,255,255,.2) 33.3%,rgba(255,255,255,.2) 33.48%,transparent 33.63%,transparent 66.35%,rgba(255,255,255,.2) 66.5%,rgba(255,255,255,.2) 66.68%,transparent 66.83%)}.viewfinder i{display:none}.camera-status{top:18px;left:20px}.switch-camera{top:auto;bottom:18px;right:20px;width:48px;height:48px;background:rgba(10,14,14,.52)}.control-deck{min-height:128px;padding:14px 24px max(18px,env(safe-area-inset-bottom));background:#080d0d;color:#f7f6ee}.source-button{color:#f7f6ee}.source-button svg{color:#b7df70}.shutter{width:78px;height:78px;border-color:#f7f6ee;background:transparent}.shutter span{background:#f7f6ee;box-shadow:inset 0 0 0 6px #f7f6ee}.shutter-wrap p{color:#b7df70;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em}.frame-count{color:#f7f6ee}.camera-note{display:none}@media(min-width:760px){.camera-page{padding:24px;place-items:center}.camera-app{width:min(100%,1280px);min-height:min(100dvh - 48px,860px);border:1px solid rgba(255,255,255,.15);border-radius:28px;overflow:hidden}.camera-stage{border-radius:0}.camera-device{grid-template-columns:none;grid-template-areas:none}.device-label{grid-area:auto}.control-deck{grid-area:auto;flex-direction:row;justify-content:space-between}.source-button{flex-direction:row}.frame-count{font-size:26px}.shutter{width:86px;height:86px}}
  </style>
  <style>.camera-tools{position:absolute;z-index:6;top:16px;right:16px;display:flex;gap:8px}.camera-tools button{width:38px;height:38px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:17px}.camera-tools .is-active{background:#b7df70;color:#153a31}.tool-sheet{position:absolute;z-index:7;right:16px;top:62px;width:min(270px,calc(100% - 32px));padding:12px;border-radius:14px;background:rgba(6,12,12,.86);color:#fff;backdrop-filter:blur(10px)}.tool-sheet button{padding:8px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:transparent;color:#fff;font:700 .72rem PlanneSans,sans-serif}.tool-sheet>div{display:flex;gap:6px;flex-wrap:wrap}.zoom-control{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:12px;font-size:.75rem;font-weight:700}.zoom-control input{accent-color:#b7df70}.sticker-layer{position:absolute;z-index:5;top:50%;left:50%;font-size:clamp(44px,10vw,90px);pointer-events:none;transform:translate(-50%,-50%)}.focus-ring{position:absolute;z-index:6;width:52px;height:52px;border:2px solid #b7df70;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}#cameraVideo{transition:filter .18s ease,transform .18s ease}</style>
  <script type="module" src="/assets/js/app-check.js"></script>
</head>
<body>
  <main class="camera-page" aria-live="polite">
    <section class="camera-app" aria-labelledby="pageTitle">
      <header class="app-bar">
        <a class="brand" href="https://planneapp.com" aria-label="Planne"><img src="/assets/brand/logo-64x64.png" width="30" height="30" alt=""><span>Planne</span></a>
        <p id="albumLabel">EVENT ALBUM</p>
      </header>
      <section class="camera-device" aria-describedby="cameraHint">
        <div class="device-label"><span>PLN · 27</span><span class="record-dot" aria-hidden="true"></span><span id="singlePhotoLabel">ONE PHOTO</span></div>
        <section class="camera-stage" id="cameraStage">
          <video id="cameraVideo" autoplay muted playsinline></video><canvas id="captureCanvas" hidden></canvas>
          <div class="camera-placeholder" id="cameraPlaceholder">
            <span class="camera-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.3-2h7.4l1.3 2h3A1.5 1.5 0 0 1 21.5 10v8.5A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5V10A1.5 1.5 0 0 1 4 8.5Z"/><circle cx="12" cy="14" r="3.4"/></svg></span>
            <h1 id="pageTitle">Keep this moment</h1><p id="cameraHint">Open the camera or choose a photo for the album.</p><button class="start-camera" id="startCameraBtn" type="button">Turn on camera</button>
          </div>
          <div class="viewfinder" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="camera-scrim" aria-hidden="true"></div>
          <div class="camera-tools" aria-label="Camera tools"><button id="flashBtn" type="button" aria-label="Flash">⚡</button><button id="effectsBtn" type="button" aria-label="Effects">✦</button><button id="stickerBtn" type="button" aria-label="Stickers">☺</button></div>
          <div class="tool-sheet" id="toolSheet" hidden><div id="effectOptions"><button data-filter="none" type="button">Natural</button><button data-filter="golden" type="button">Golden hour</button><button data-filter="soft" type="button">Soft glow</button><button data-filter="garden" type="button">Garden</button><button data-filter="party" type="button">Party flash</button><button data-filter="film" type="button">Film</button><button data-filter="mono" type="button">Mono</button></div><label class="zoom-control">Zoom <input id="zoomRange" type="range" min="1" max="3" step=".1" value="1"><output id="zoomValue">1×</output></label><div id="stickerOptions" hidden><button data-sticker="✨" type="button">✨</button><button data-sticker="❤️" type="button">❤️</button><button data-sticker="🥂" type="button">🥂</button><button data-sticker="🎉" type="button">🎉</button></div></div>
          <div class="sticker-layer" id="stickerLayer" aria-hidden="true"></div><span class="focus-ring" id="focusRing" hidden aria-hidden="true"></span>
          <div class="camera-status" id="cameraStatus" hidden><span></span><span id="cameraStatusText">CAMERA READY</span></div>
          <button class="switch-camera" id="switchCameraBtn" type="button" hidden aria-label="Trocar câmera"><svg viewBox="0 0 24 24"><path d="M7 7h10l-2-2m2 2-2 2M17 17H7l2 2m-2-2 2-2"/><path d="M19 7a7 7 0 0 0-12-2M5 17a7 7 0 0 0 12 2"/></svg></button>
        </section>
        <section class="control-deck" aria-label="Controles da câmera">
          <button class="source-button" id="chooseFileBtn" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.4"/><path d="m21 15-4.8-4.8L6 20"/></svg><span id="chooseFileLabel">Photo roll</span></button>
          <div class="shutter-wrap"><button class="shutter" id="captureBtn" type="button" disabled aria-label="Take photo"><span></span></button><p id="captureLabel">Turn on the camera</p></div>
          <span class="frame-count" aria-hidden="true">01<br><small id="photoCountLabel">photo</small></span>
        </section>
      </section>
      <p class="camera-note" id="cameraNote">Photos are available only to the host in the Planne app.</p>
    </section>
  </main>
  <input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
  <section class="review" id="review" aria-modal="true" aria-labelledby="reviewTitle" role="dialog" hidden><div class="review-image-wrap"><img id="reviewImage" alt="Selected photo preview"></div><div class="review-panel"><div class="review-heading"><p id="reviewFilmLabel">PHOTO 01</p><h2 id="reviewTitle">Does it look good?</h2></div><label class="name-field" for="uploaderName"><span id="uploaderNameLabel">Your name</span><span id="uploaderNameOptional">optional</span><input id="uploaderName" type="text" maxlength="80" autocomplete="name" placeholder="To appear with the photo"></label><p class="form-error" id="formError" role="alert" hidden></p><div class="review-actions"><button class="secondary-action" id="retakeBtn" type="button">Retake</button><button class="send-action" id="submitBtn" type="button">Develop photo</button></div></div></section>
  <section class="result-card" id="resultCard" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden><div class="result-icon" aria-hidden="true"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="send-action" id="resultAction" type="button"></button></section>
  <script src="/assets/js/gallery.js?v=20260919-disposable-camera" defer></script>
</body>
</html>
