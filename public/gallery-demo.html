<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    >

    <title>Planne — Câmera do evento</title>

    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#09090b">

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="/assets/brand/favicon-32x32.png"
    >

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #09090b;
            --white: #ffffff;

            --purple: #9b5cff;
            --purple-light: #c6a7ff;

            --surface:
                rgba(18, 18, 22, .72);

            --soft:
                rgba(255, 255, 255, .12);

            --muted:
                rgba(255, 255, 255, .65);
        }

        html,
        body {
            width: 100%;
            height: 100%;

            background: var(--bg);
            color: var(--white);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            color: inherit;
            cursor: pointer;
        }

        /* =========================================================
           CAMERA APP
        ========================================================= */

        .camera-app {
            position: relative;

            width: 100%;
            height: 100dvh;
            min-height: 100%;

            overflow: hidden;

            background: #08080a;
        }

        /* =========================================================
           CAMERA FAKE

           Depois substituímos isso pelo <video>.
        ========================================================= */

        .camera-feed {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            background:
                radial-gradient(
                    circle at 60% 30%,
                    rgba(125, 83, 180, .25),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 30% 65%,
                    rgba(61, 42, 82, .2),
                    transparent 35%
                ),
                linear-gradient(
                    145deg,
                    #25222b 0%,
                    #121116 45%,
                    #08080a 100%
                );

            transition:
                transform .5s cubic-bezier(.22, 1, .36, 1),
                opacity .5s ease;
        }

        /* =========================================================
           VINHETA
        ========================================================= */

        .camera-vignette {
            position: absolute;
            z-index: 2;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 40%,
                    rgba(0, 0, 0, .08) 65%,
                    rgba(0, 0, 0, .45) 100%
                );
        }

        /* =========================================================
           GRÃO FOTOGRÁFICO
        ========================================================= */

        .camera-grain {
            position: absolute;
            z-index: 3;
            inset: 0;

            pointer-events: none;

            opacity: .025;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E");
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .camera-header {
            position: absolute;

            z-index: 10;

            top: 0;
            left: 0;

            width: 100%;

            padding:
                calc(env(safe-area-inset-top) + 16px)
                18px
                18px;

            display: grid;

            grid-template-columns:
                48px
                1fr
                48px;

            align-items: center;

            animation:
                cameraHeaderEntrance
                .8s cubic-bezier(.22, 1, .36, 1)
                .8s both;
        }

        @keyframes cameraHeaderEntrance {

            from {
                opacity: 0;
                transform: translateY(-18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================================================
           BOTÕES GLASS
        ========================================================= */

        .round-action {
            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(10, 10, 12, .42);

            border:
                1px solid rgba(255, 255, 255, .13);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .08),
                0 8px 25px rgba(0, 0, 0, .14);

            transition:
                transform .18s ease,
                background .18s ease;
        }

        .round-action:hover {
            background:
                rgba(255, 255, 255, .12);
        }

        .round-action:active {
            transform:
                scale(.9);
        }

        .round-action svg {
            width: 21px;
            height: 21px;

            fill: none;

            stroke: white;
            stroke-width: 1.8;
        }

        /* =========================================================
           EVENTO
        ========================================================= */

        .event-info {
            min-width: 0;

            padding:
                0 10px;

            text-align: center;
        }

        .event-name {
            overflow: hidden;

            font-size: 15px;
            font-weight: 650;

            letter-spacing: -.2px;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .event-label {
            margin-top: 3px;

            color:
                rgba(255, 255, 255, .62);

            font-size: 11px;
            font-weight: 500;
        }

        /* =========================================================
           STATUS
        ========================================================= */

        .camera-message {
            position: absolute;

            z-index: 5;

            top:
                calc(
                    env(safe-area-inset-top)
                    + 96px
                );

            left: 50%;

            transform:
                translateX(-50%);

            width: max-content;

            max-width:
                calc(100% - 48px);

            padding:
                9px 14px;

            border:
                1px solid rgba(255, 255, 255, .12);

            border-radius: 999px;

            background:
                rgba(10, 10, 12, .38);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            color:
                rgba(255, 255, 255, .86);

            font-size: 12px;
            font-weight: 500;

            white-space: nowrap;

            animation:
                cameraMessageEntrance
                .7s cubic-bezier(.22, 1, .36, 1)
                1s both;
        }

        @keyframes cameraMessageEntrance {

            from {
                opacity: 0;

                transform:
                    translate(-50%, -8px)
                    scale(.96);
            }

            to {
                opacity: 1;

                transform:
                    translate(-50%, 0)
                    scale(1);
            }

        }

        .live-dot {
            width: 6px;
            height: 6px;

            display: inline-block;

            margin-right: 5px;

            border-radius: 50%;

            background:
                #b88cff;

            box-shadow:
                0 0 0 4px rgba(184, 140, 255, .09),
                0 0 12px rgba(184, 140, 255, .65);

            animation:
                livePulse
                2.2s ease-in-out infinite;
        }

        @keyframes livePulse {

            0%,
            100% {
                opacity: .65;
                transform: scale(.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }

        }

        /* =========================================================
           CONTROLES
        ========================================================= */

        .camera-controls {
            position: absolute;

            z-index: 10;

            bottom: 0;
            left: 0;

            width: 100%;

            padding:
                30px
                24px
                calc(env(safe-area-inset-bottom) + 18px);

            background:
                linear-gradient(
                    to top,
                    rgba(5, 5, 7, .98),
                    rgba(5, 5, 7, .75) 50%,
                    transparent
                );

            animation:
                cameraControlsEntrance
                .9s cubic-bezier(.22, 1, .36, 1)
                .85s both;
        }

        @keyframes cameraControlsEntrance {

            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .controls-row {
            display: grid;

            grid-template-columns:
                1fr
                100px
                1fr;

            align-items: center;

            max-width: 440px;

            margin:
                0 auto;
        }

        /* =========================================================
           CONTROLES LATERAIS
        ========================================================= */

        .side-control {
            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 8px;

            background:
                transparent;

            color:
                rgba(255, 255, 255, .76);

            font-size: 11px;
            font-weight: 500;
        }

        .side-control:first-child {
            justify-self: start;
        }

        .side-control:last-child {
            justify-self: end;
        }

        .side-control-icon {
            width: 46px;
            height: 46px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid rgba(255, 255, 255, .1);

            border-radius: 15px;

            background:
                rgba(255, 255, 255, .1);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .08),
                0 8px 25px rgba(0, 0, 0, .14);

            transition:
                transform .22s cubic-bezier(.22, 1, .36, 1),
                background .22s ease;
        }

        .side-control:hover
        .side-control-icon {
            transform:
                translateY(-2px);

            background:
                rgba(255, 255, 255, .15);
        }

        .side-control:active
        .side-control-icon {
            transform:
                scale(.9);
        }

        .side-control svg {
            width: 21px;
            height: 21px;

            fill: none;

            stroke: white;
            stroke-width: 1.7;
        }

        /* =========================================================
           SHUTTER
        ========================================================= */

        .shutter {
            position: relative;

            width: 82px;
            height: 82px;

            display: flex;

            align-items: center;
            justify-content: center;

            justify-self: center;

            overflow: visible;

            border:
                2px solid rgba(255, 255, 255, .92);

            border-radius: 50%;

            background:
                rgba(255, 255, 255, .08);

            box-shadow:
                0 8px 30px rgba(0, 0, 0, .35),
                0 0 0 1px rgba(255, 255, 255, .08);

            transition:
                transform .14s ease;
        }

        .shutter::before {
            content: "";

            position: absolute;

            inset: -9px;

            border:
                1px solid rgba(255, 255, 255, .08);

            border-radius: 50%;

            opacity: .8;

            transition:
                transform .3s ease,
                opacity .3s ease;
        }

        .shutter-inner {
            width: 66px;
            height: 66px;

            display: block;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #e9e9ed
                );

            box-shadow:
                inset 0 -2px 4px rgba(0, 0, 0, .08);

            transition:
                transform .16s cubic-bezier(.22, 1, .36, 1);
        }

        .shutter:hover
        .shutter-inner {
            transform:
                scale(.94);
        }

        .shutter:active {
            transform:
                scale(.94);
        }

        .shutter:active
        .shutter-inner {
            transform:
                scale(.82);
        }

        .shutter:active::before {
            transform:
                scale(1.08);

            opacity: 0;
        }

        /* =========================================================
           PLANNE BRAND
        ========================================================= */

        .planne-brand {
            margin-top: 22px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 6px;

            color:
                rgba(255, 255, 255, .38);

            font-size: 10px;
        }

        .planne-brand strong {
            color:
                rgba(255, 255, 255, .68);

            font-weight: 600;
        }

        .planne-dot {
            width: 4px;
            height: 4px;

            border-radius: 50%;

            background:
                var(--purple);

            box-shadow:
                0 0 10px rgba(155, 92, 255, .7);
        }

        /* =========================================================
           FLASH
        ========================================================= */

        .camera-flash {
            position: absolute;

            z-index: 90;

            inset: 0;

            pointer-events: none;

            background:
                white;

            opacity: 0;
        }

        .camera-flash.active {
            animation:
                cameraFlash
                .35s ease-out;
        }

        @keyframes cameraFlash {

            0% {
                opacity: 0;
            }

            12% {
                opacity: .92;
            }

            35% {
                opacity: .4;
            }

            100% {
                opacity: 0;
            }

        }

        /* =========================================================
           FOCUS
        ========================================================= */

        .focus-ring {
            position: absolute;

            z-index: 20;

            width: 70px;
            height: 70px;

            display: none;

            pointer-events: none;

            border:
                1.5px solid rgba(255, 255, 255, .92);

            border-radius: 12px;

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(1.35);
        }

        .focus-ring::before,
        .focus-ring::after,
        .focus-ring span::before,
        .focus-ring span::after {
            content: "";

            position: absolute;

            background:
                white;
        }

        .focus-ring::before {
            width: 10px;
            height: 1px;

            left: -6px;
            top: 50%;
        }

        .focus-ring::after {
            width: 10px;
            height: 1px;

            right: -6px;
            top: 50%;
        }

        .focus-ring span::before {
            width: 1px;
            height: 10px;

            top: -6px;
            left: 50%;
        }

        .focus-ring span::after {
            width: 1px;
            height: 10px;

            bottom: -6px;
            left: 50%;
        }

        .focus-ring.active {
            display: block;

            animation:
                focusAnimation
                .8s cubic-bezier(.22, 1, .36, 1)
                forwards;
        }

        @keyframes focusAnimation {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(1.4);
            }

            25% {
                opacity: 1;
            }

            55% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            80% {
                opacity: 1;
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(.96);
            }

        }

        /* =========================================================
           PREVIEW
        ========================================================= */

        .preview-screen {
            position: absolute;

            z-index: 30;

            inset: 0;

            display: none;

            background:
                #08080a;
        }

        .preview-screen.active {
            display: block;

            animation:
                previewEntrance
                .45s cubic-bezier(.22, 1, .36, 1);
        }

        @keyframes previewEntrance {

            from {
                opacity: 0;

                transform:
                    scale(1.045);

                filter:
                    blur(3px);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);

                filter:
                    blur(0);
            }

        }

        .preview-image {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(125, 83, 180, .25),
                    transparent 35%
                ),
                linear-gradient(
                    145deg,
                    #312b3b,
                    #111014
                );
        }

        .preview-overlay {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, .5),
                    transparent 30%,
                    transparent 45%,
                    rgba(0, 0, 0, .9) 100%
                );
        }

        /* =========================================================
           PREVIEW HEADER
        ========================================================= */

        .preview-header {
            position: absolute;

            z-index: 2;

            top: 0;
            left: 0;

            width: 100%;

            padding:
                calc(env(safe-area-inset-top) + 16px)
                18px;

            display: flex;

            align-items: center;
            justify-content: space-between;
        }

        .preview-title {
            position: absolute;

            left: 50%;

            transform:
                translateX(-50%);

            font-size: 14px;
            font-weight: 600;
        }

        /* =========================================================
           PREVIEW BOTTOM
        ========================================================= */

        .preview-bottom {
            position: absolute;

            z-index: 2;

            left: 0;
            bottom: 0;

            width: 100%;

            padding:
                28px
                20px
                calc(env(safe-area-inset-bottom) + 24px);

            animation:
                previewControlsEntrance
                .6s cubic-bezier(.22, 1, .36, 1)
                .08s both;
        }

        @keyframes previewControlsEntrance {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================================================
           NAME
        ========================================================= */

        .name-field {
            max-width: 440px;

            margin:
                0 auto 17px;
        }

        .name-field label {
            display: block;

            margin:
                0 0 8px 4px;

            color:
                rgba(255, 255, 255, .68);

            font-size: 11px;
            font-weight: 500;
        }

        .name-field input {
            width: 100%;
            height: 52px;

            padding:
                0 17px;

            outline: none;

            border:
                1px solid rgba(255, 255, 255, .13);

            border-radius: 16px;

            background:
                rgba(20, 20, 24, .72);

            color:
                white;

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            font-size: 14px;

            transition:
                border .2s ease,
                box-shadow .2s ease;
        }

        .name-field input::placeholder {
            color:
                rgba(255, 255, 255, .38);
        }

        .name-field input:focus {
            border-color:
                rgba(171, 128, 255, .7);

            box-shadow:
                0 0 0 3px
                rgba(155, 92, 255, .12);
        }

        /* =========================================================
           PREVIEW ACTIONS
        ========================================================= */

        .preview-actions {
            max-width: 440px;

            margin:
                auto;

            display: grid;

            grid-template-columns:
                1fr
                1.65fr;

            gap: 10px;
        }

        .preview-button {
            height: 54px;

            border-radius: 17px;

            font-size: 13px;
            font-weight: 650;

            transition:
                transform .15s ease;
        }

        .preview-button:active {
            transform:
                scale(.97);
        }

        .preview-button.secondary {
            border:
                1px solid rgba(255, 255, 255, .11);

            background:
                rgba(255, 255, 255, .11);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);
        }

        .preview-button.primary {
            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #eeeaf5
                );

            color:
                #111114;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, .3),
                0 0 30px rgba(155, 92, 255, .08);
        }

        .preview-button.primary::after {
            content: "";

            position: absolute;

            top: -50%;
            left: -100%;

            width: 55%;
            height: 200%;

            transform:
                rotate(20deg);

            background:
                linear-gradient(
                    to right,
                    transparent,
                    rgba(255, 255, 255, .8),
                    transparent
                );

            opacity: .45;

            transition:
                left .7s cubic-bezier(.22, 1, .36, 1);
        }

        .preview-button.primary:hover::after {
            left: 150%;
        }

        /* =========================================================
           INTRO PLANNE
        ========================================================= */

        .camera-intro {
            position: absolute;

            z-index: 100;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #20162e,
                    #09090b 55%
                );

            animation:
                introDisappear
                .9s cubic-bezier(.22, 1, .36, 1)
                1.25s forwards;
        }

        .intro-brand {
            display: flex;

            flex-direction: column;

            align-items: center;

            animation:
                introBrand
                .9s cubic-bezier(.22, 1, .36, 1);
        }

        .intro-logo {
            width: 68px;
            height: 68px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 18px;

            border:
                1px solid rgba(255, 255, 255, .09);

            border-radius: 22px;

            background:
                rgba(255, 255, 255, .07);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:
                0 18px 50px rgba(0, 0, 0, .3),
                0 0 40px rgba(155, 92, 255, .12);
        }

        .intro-logo img {
            width: 43px;
            height: 43px;

            object-fit: contain;
        }

        .intro-brand span {
            margin-bottom: 5px;

            color:
                rgba(255, 255, 255, .45);

            font-size: 11px;
            font-weight: 500;

            letter-spacing: .8px;

            text-transform: uppercase;
        }

        .intro-brand strong {
            font-size: 22px;
            font-weight: 650;

            letter-spacing: -.5px;
        }

        @keyframes introBrand {

            from {
                opacity: 0;

                transform:
                    translateY(10px)
                    scale(.94);

                filter:
                    blur(8px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter:
                    blur(0);
            }

        }

        @keyframes introDisappear {

            0% {
                opacity: 1;
                visibility: visible;
            }

            100% {
                opacity: 0;
                visibility: hidden;

                pointer-events: none;
            }

        }

        /* =========================================================
           DESKTOP
        ========================================================= */

        @media (min-width: 700px) {

            body {
                display: flex;

                align-items: center;
                justify-content: center;

                padding:
                    20px;

                background:
                    radial-gradient(
                        circle at 50% 20%,
                        #21192d,
                        #09090b 55%
                    );
            }

            .camera-app {
                width:
                    min(430px, 100%);

                height:
                    min(
                        880px,
                        calc(100vh - 40px)
                    );

                border-radius:
                    34px;

                box-shadow:
                    0 30px 100px rgba(0, 0, 0, .55),
                    0 0 0 1px rgba(255, 255, 255, .08);
            }

        }

        /* =========================================================
           MOBILE PEQUENO
        ========================================================= */

        @media (max-width: 360px) {

            .camera-controls {
                padding-left:
                    18px;

                padding-right:
                    18px;
            }

            .controls-row {
                grid-template-columns:
                    1fr
                    90px
                    1fr;
            }

            .shutter {
                width: 74px;
                height: 74px;
            }

            .shutter-inner {
                width: 59px;
                height: 59px;
            }

            .side-control-icon {
                width: 42px;
                height: 42px;
            }

        }

        /* =========================================================
           MOBILE — REMOVE HOVER
        ========================================================= */

        @media (hover: none) {

            .shutter:hover
            .shutter-inner {
                transform:
                    none;
            }

            .side-control:hover
            .side-control-icon {
                transform:
                    none;
            }

        }

        /* =========================================================
           ACESSIBILIDADE
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;
            }

        }

    </style>
</head>


<body>

<div
    class="camera-app"
    id="cameraApp"
>

    <!-- =====================================================
         INTRO PLANNE
    ====================================================== -->

    <div
        class="camera-intro"
        id="cameraIntro"
    >

        <div class="intro-brand">

            <div class="intro-logo">

                <img
                    src="/assets/brand/logo-64x64.png"
                    alt="Planne"
                >

            </div>

            <span>
                Câmera do evento
            </span>

            <strong>
                Planne
            </strong>

        </div>

    </div>


    <!-- =====================================================
         CÂMERA

         Por enquanto fundo visual.

         Depois será:

         <video
             class="camera-feed"
             id="cameraVideo"
             autoplay
             playsinline
             muted>
         </video>
    ====================================================== -->

    <div
        class="camera-feed"
        id="cameraFeed"
    ></div>


    <!-- EFEITOS -->

    <div class="camera-vignette"></div>

    <div class="camera-grain"></div>

    <div
        class="camera-flash"
        id="cameraFlash"
    ></div>


    <!-- =====================================================
         FOCO
    ====================================================== -->

    <div
        class="focus-ring"
        id="focusRing"
    >
        <span></span>
    </div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="camera-header">

        <button
            class="round-action"
            id="closeCameraBtn"
            type="button"
            aria-label="Fechar"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M18 6L6 18M6 6l12 12"
                />

            </svg>

        </button>


        <div class="event-info">

            <div
                class="event-name"
                id="eventName"
            >
                Júlia & Marcos
            </div>

            <div class="event-label">
                Câmera do evento
            </div>

        </div>


        <button
            class="round-action"
            id="openAlbumBtn"
            type="button"
            aria-label="Abrir álbum"
        >

            <svg viewBox="0 0 24 24">

                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="4"
                />

                <circle
                    cx="8.5"
                    cy="8.5"
                    r="1.5"
                />

                <path
                    d="M21 15l-5-5L5 21"
                />

            </svg>

        </button>

    </header>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div class="camera-message">

        <span class="live-dot"></span>

        Pronto para registrar

    </div>


    <!-- =====================================================
         CONTROLES
    ====================================================== -->

    <div class="camera-controls">

        <div class="controls-row">


            <!-- GALERIA -->

            <button
                class="side-control"
                id="galleryBtn"
                type="button"
            >

                <div class="side-control-icon">

                    <svg viewBox="0 0 24 24">

                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="4"
                        />

                        <circle
                            cx="8.5"
                            cy="8.5"
                            r="1.5"
                        />

                        <path
                            d="M21 15l-5-5L5 21"
                        />

                    </svg>

                </div>

                <span>
                    Galeria
                </span>

            </button>


            <!-- SHUTTER -->

            <button
                class="shutter"
                id="captureBtn"
                type="button"
                aria-label="Tirar foto"
            >

                <span
                    class="shutter-inner"
                ></span>

            </button>


            <!-- TROCAR CÂMERA -->

            <button
                class="side-control"
                id="switchCameraBtn"
                type="button"
            >

                <div class="side-control-icon">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M20 7h-3l-2-3H9L7 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"
                        />

                        <path
                            d="M16 12a4 4 0 01-7.5 2"
                        />

                        <path
                            d="M8 12a4 4 0 017.5-2"
                        />

                        <path
                            d="M15 7v3h3"
                        />

                        <path
                            d="M9 17v-3H6"
                        />

                    </svg>

                </div>

                <span>
                    Virar
                </span>

            </button>

        </div>


        <!-- PLANNE -->

        <div class="planne-brand">

            Feito com

            <span class="planne-dot"></span>

            <strong>
                Planne
            </strong>

        </div>

    </div>


    <!-- =====================================================
         GALERIA NATIVA
    ====================================================== -->

    <input
        type="file"
        id="fileInput"
        accept="image/*"
        hidden
    >


    <!-- =====================================================
         PREVIEW
    ====================================================== -->

    <section
        class="preview-screen"
        id="previewScreen"
    >

        <div
            class="preview-image"
            id="previewImage"
        ></div>

        <div class="preview-overlay"></div>


        <!-- HEADER -->

        <div class="preview-header">

            <button
                class="round-action"
                id="closePreview"
                type="button"
                aria-label="Voltar"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M19 12H5"
                    />

                    <path
                        d="M12 19l-7-7 7-7"
                    />

                </svg>

            </button>


            <div class="preview-title">
                Sua foto
            </div>

        </div>


        <!-- BOTTOM -->

        <div class="preview-bottom">


            <!-- NOME -->

            <div class="name-field">

                <label for="uploaderName">
                    Quem tirou essa foto?
                </label>

                <input
                    id="uploaderName"
                    type="text"
                    maxlength="80"
                    autocomplete="name"
                    placeholder="Seu nome (opcional)"
                >

            </div>


            <!-- AÇÕES -->

            <div class="preview-actions">

                <button
                    class="preview-button secondary"
                    id="retakeBtn"
                    type="button"
                >
                    Refazer
                </button>


                <button
                    class="preview-button primary"
                    id="submitBtn"
                    type="button"
                >
                    Enviar para o álbum
                </button>

            </div>

        </div>

    </section>

</div>


<script>

    /* =========================================================
       ELEMENTOS
    ========================================================= */

    const cameraApp =
        document.getElementById('cameraApp');

    const cameraFeed =
        document.getElementById('cameraFeed');

    const previewScreen =
        document.getElementById('previewScreen');

    const flash =
        document.getElementById('cameraFlash');

    const focusRing =
        document.getElementById('focusRing');

    const captureBtn =
        document.getElementById('captureBtn');

    const switchCameraBtn =
        document.getElementById('switchCameraBtn');

    const galleryBtn =
        document.getElementById('galleryBtn');

    const fileInput =
        document.getElementById('fileInput');

    const closePreview =
        document.getElementById('closePreview');

    const retakeBtn =
        document.getElementById('retakeBtn');

    const previewImage =
        document.getElementById('previewImage');


    /* =========================================================
       CAPTURA

       Por enquanto é somente demonstração visual.
    ========================================================= */

    captureBtn.addEventListener(
        'click',
        () => {

            /* vibração curta */

            if ('vibrate' in navigator) {

                navigator.vibrate(25);

            }


            /* flash */

            flash.classList.remove(
                'active'
            );

            void flash.offsetWidth;

            flash.classList.add(
                'active'
            );


            /* leve freeze visual */

            cameraFeed.animate(

                [
                    {
                        transform:
                            'scale(1)'
                    },

                    {
                        transform:
                            'scale(1.015)'
                    },

                    {
                        transform:
                            'scale(1)'
                    }
                ],

                {
                    duration: 300,

                    easing:
                        'cubic-bezier(.22, 1, .36, 1)'
                }

            );


            /* abre preview */

            setTimeout(
                () => {

                    previewScreen
                        .classList
                        .add('active');

                },
                180
            );

        }
    );


    /* =========================================================
       VOLTAR DA PREVIEW
    ========================================================= */

    closePreview.addEventListener(
        'click',
        () => {

            previewScreen
                .classList
                .remove('active');

        }
    );


    /* =========================================================
       REFAZER FOTO
    ========================================================= */

    retakeBtn.addEventListener(
        'click',
        () => {

            previewScreen
                .classList
                .remove('active');

        }
    );


    /* =========================================================
       GALERIA
    ========================================================= */

    galleryBtn.addEventListener(
        'click',
        () => {

            fileInput.click();

        }
    );


    /* =========================================================
       MOSTRAR FOTO ESCOLHIDA DA GALERIA
    ========================================================= */

    fileInput.addEventListener(
        'change',
        () => {

            const file =
                fileInput.files?.[0];


            if (!file) {
                return;
            }


            const url =
                URL.createObjectURL(file);


            previewImage.style.backgroundImage =
                `url("${url}")`;

            previewImage.style.backgroundSize =
                'cover';

            previewImage.style.backgroundPosition =
                'center';


            previewScreen
                .classList
                .add('active');

        }
    );


    /* =========================================================
       FOCO AO TOCAR NA IMAGEM
    ========================================================= */

    cameraApp.addEventListener(
        'pointerdown',
        (event) => {

            /*
             * Ignora botões.
             */

            if (
                event.target.closest('button')
            ) {
                return;
            }


            /*
             * Não executa na preview.
             */

            if (
                previewScreen
                    .classList
                    .contains('active')
            ) {
                return;
            }


            const rect =
                cameraApp
                    .getBoundingClientRect();


            const x =
                event.clientX
                - rect.left;


            const y =
                event.clientY
                - rect.top;


            focusRing.style.left =
                `${x}px`;

            focusRing.style.top =
                `${y}px`;


            focusRing
                .classList
                .remove('active');


            void focusRing.offsetWidth;


            focusRing
                .classList
                .add('active');

        }
    );


    /* =========================================================
       TROCAR CÂMERA

       Animação de demonstração.
    ========================================================= */

    switchCameraBtn.addEventListener(
        'click',
        () => {

            if ('vibrate' in navigator) {

                navigator.vibrate(15);

            }


            cameraFeed.animate(

                [

                    {
                        opacity: 1,

                        transform:
                            'scale(1)'
                    },

                    {
                        opacity: .15,

                        transform:
                            'scale(.96)'
                    },

                    {
                        opacity: 1,

                        transform:
                            'scale(1)'
                    }

                ],

                {

                    duration: 450,

                    easing:
                        'cubic-bezier(.22, 1, .36, 1)'

                }

            );

        }
    );


    /* =========================================================
       BOTÃO ENVIAR — DEMONSTRAÇÃO

       Ainda não está ligado ao Firebase.
    ========================================================= */

    document
        .getElementById('submitBtn')
        .addEventListener(
            'click',
            function () {

                const button =
                    this;


                button.disabled =
                    true;


                button.textContent =
                    'Enviando…';


                if ('vibrate' in navigator) {

                    navigator.vibrate(20);

                }


                setTimeout(
                    () => {

                        button.textContent =
                            '✓ Foto enviada';


                        setTimeout(
                            () => {

                                previewScreen
                                    .classList
                                    .remove('active');


                                button.textContent =
                                    'Enviar para o álbum';


                                button.disabled =
                                    false;


                                fileInput.value =
                                    '';

                            },
                            1000
                        );

                    },
                    1000
                );

            }
        );

</script>

</body>

</html>
