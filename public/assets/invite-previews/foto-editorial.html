<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planne — Convite digital, Foto Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@400;500&display=swap">
<style>
  :root {
    --ink: #2a2420;
    --muted: #8a7f76;
    --paper: #faf7f3;
    --accent: #b8935f;
    --line: #ddd3c8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: "Jost", sans-serif; }

  .page { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); }

  /* Hero — real cover photo goes here in the live app; this preview keeps
     the same warm gradient placeholder the design template ships with. */
  .hero {
    position: relative; height: 62vh; min-height: 420px;
    background:
      linear-gradient(180deg, rgba(20,15,10,0) 40%, rgba(20,15,10,.75) 100%),
      radial-gradient(120% 90% at 20% 15%, #e9c9a8 0%, #cfa27a 35%, #9c6b4d 70%, #5b3a2c 100%);
    display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden;
  }
  .hero-content { position: relative; z-index: 1; padding: 0 32px 40px; text-align: center; color: #fff; }
  .hero-eyebrow { font: 500 .68rem "Jost"; letter-spacing: .3em; text-transform: uppercase; opacity: .85; margin: 0 0 .8rem; }
  .hero-title {
    font-family: "Bodoni Moda", serif; font-weight: 500; font-style: italic;
    font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 1; margin: 0; letter-spacing: -.01em;
  }

  .body-copy { padding: 3rem 2.2rem 2.5rem; text-align: center; }
  .date-line {
    font: 500 .95rem "Jost"; letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
    margin: 0 0 .4rem;
  }
  .venue-line { font: 400 .9rem "Jost"; color: var(--muted); margin: 0 0 2rem; }
  .rule { width: 40px; height: 1px; background: var(--accent); margin: 0 auto 2rem; }
  .lede { font: 400 1rem/1.7 "Jost"; color: var(--ink); max-width: 34ch; margin: 0 auto 2.4rem; }

  .fields { text-align: left; }
  .field { margin-bottom: 1.4rem; }
  .field label { display: block; font: 500 .72rem "Jost"; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
  .field input, .field select {
    width: 100%; height: 46px; border: none; border-bottom: 1px solid var(--line); background: transparent;
    font: 400 .95rem "Jost"; color: var(--ink); padding: 0; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }

  .presence { display: flex; gap: 0; border: 1px solid var(--line); }
  .presence button {
    flex: 1; height: 46px; border: none; background: transparent; font: 500 .85rem "Jost"; color: var(--muted); cursor: pointer;
  }
  .presence button.active { background: var(--ink); color: var(--paper); }

  .btn {
    display: block; width: 100%; height: 52px; margin-top: 2rem; border: 1px solid var(--ink); background: transparent;
    color: var(--ink); font: 500 .8rem "Jost"; letter-spacing: .18em; text-transform: uppercase; cursor: pointer;
  }

  .foot { text-align: center; padding: 2rem 0 3rem; font: 400 .72rem "Jost"; color: var(--muted); letter-spacing: .05em; }
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div class="hero-content">
      <p class="hero-eyebrow" id="eyebrow"></p>
      <h1 class="hero-title" id="title"></h1>
    </div>
  </div>
  <div class="body-copy">
    <p class="date-line" id="date"></p>
    <p class="venue-line" id="venue"></p>
    <div class="rule"></div>
    <p class="lede" id="lede"></p>
  </div>
  <div class="body-copy fields" style="padding-top:0">
    <div class="field"><label id="label-name"></label><input type="text" tabindex="-1"></div>
    <div class="field"><label id="label-phone"></label><input type="tel" placeholder="(00) 00000-0000" tabindex="-1"></div>
    <div class="field">
      <label id="label-presence"></label>
      <div class="presence">
        <button class="active" id="btn-yes" tabindex="-1"></button>
        <button id="btn-no" tabindex="-1"></button>
      </div>
    </div>
    <button class="btn" id="btn-submit" tabindex="-1"></button>
  </div>
  <p class="foot" id="foot"></p>
</div>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var lang = qs.get('lang') === 'en' ? 'en' : 'pt';
  var STR = {
    pt: {
      eyebrow: "Você foi convidado", title: "Júlia & Marcos",
      date: "Sábado, 26 de Setembro", venue: "Salão de Festas · Ponta Negra",
      lede: "Preencha seus dados abaixo para confirmar sua presença conosco nesse dia especial.",
      name: "Nome completo", phone: "Telefone", presence: "Presença",
      yes: "Vou comparecer", no: "Não vou poder ir", submit: "Confirmar presença",
      foot: "Planne · Convite Digital"
    },
    en: {
      eyebrow: "You're invited", title: "Sarah & James",
      date: "Saturday, September 26", venue: "The Harborview Estate",
      lede: "Fill in your details below to confirm your presence with us on this special day.",
      name: "Full name", phone: "Phone", presence: "Attending",
      yes: "I'll be there", no: "Can't make it", submit: "Confirm attendance",
      foot: "Planne · Digital Invitation"
    }
  }[lang];
  var set = function (id, value) { document.getElementById(id).textContent = value; };
  set('eyebrow', qs.get('eyebrow') || STR.eyebrow);
  set('title', qs.get('title') || STR.title);
  set('date', qs.get('date') || STR.date);
  set('venue', qs.get('venue') || STR.venue);
  set('lede', STR.lede);
  set('label-name', STR.name);
  set('label-phone', STR.phone);
  set('label-presence', STR.presence);
  set('btn-yes', STR.yes);
  set('btn-no', STR.no);
  set('btn-submit', STR.submit);
  set('foot', STR.foot);
})();
</script>
</body>
</html>
