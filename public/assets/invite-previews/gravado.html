<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planne — Convite digital, Cartão Gravado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bonheur+Royale&family=Jost:wght@400;500&display=swap">
<style>
  /* Same structure/classes as the real invitation (rsvp.html + rsvp-templates.css):
     photo in an engraved gold frame with a wax seal, title/date in solid text
     below, then the RSVP card (countdown + form start). This style is always
     dark, by design — it doesn't follow the site's light/dark toggle, same as
     in production. Only the copy and the photo are placeholders. */
  :root {
    --paper: #0a1f1a; --ink: #f3ead4; --muted: #b9ab8a; --line: rgba(212,181,106,.3); --mist: #16352d;
    --teal: #d4b56a; --teal-dark: #f3ead4;
    --display-font: "Bonheur Royale", cursive; --body-font: "Jost", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(ellipse 90% 60% at 50% 0%, #163a32 0%, #0e2b25 55%, #081a16 100%), var(--paper);
    color: var(--ink); font-family: var(--body-font);
  }

  .hero { position: relative; z-index: 2; width: 100%; padding: clamp(2.4rem, 9vw, 3.6rem) 20px 0; text-align: center; }
  .hero-photo-frame { position: relative; width: min(300px, 72vw); margin: 0 auto 1.6rem; }
  .hero-photo-clip {
    position: relative; aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden;
    box-shadow: 0 20px 44px -18px rgba(0,0,0,.55);
    background: linear-gradient(160deg, #3a2c1c, #1c2b26 55%, #0a1f1a);
  }
  .hero-frame { position: absolute; inset: 6px; z-index: 1; pointer-events: none; }
  .hero-corner { position: absolute; width: 22px; height: 22px; }
  .hero-corner svg { width: 100%; height: 100%; stroke: var(--teal); fill: none; stroke-width: 1.4; }
  .hero-corner.tl { top: 0; left: 0; }
  .hero-corner.tr { top: 0; right: 0; transform: scaleX(-1); }
  .hero-corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
  .hero-corner.br { bottom: 0; right: 0; transform: scale(-1,-1); }
  .hero-seal {
    display: flex; align-items: center; justify-content: center; position: absolute; z-index: 2;
    left: 50%; bottom: -22px; transform: translateX(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ecd9a8, #d4b56a 60%, #a9822f 100%);
    box-shadow: 0 8px 18px rgba(212,181,106,.4);
  }
  .hero-seal svg { width: 18px; height: 18px; stroke: #0a1f1a; stroke-width: 2; fill: none; }
  .hero-eyebrow { font: 600 .72rem "Jost", sans-serif; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); margin: 0 0 .5rem; }
  .hero-title { font-family: var(--display-font); font-weight: 700; font-size: clamp(1.9rem, 7vw, 2.7rem); line-height: 1.15; margin: 0; color: var(--ink); }
  .hero-date { font: 500 .9rem "Jost", sans-serif; color: var(--muted); margin: .55rem 0 0; text-transform: capitalize; }

  .card {
    width: min(560px, calc(100vw - 40px)); max-width: 560px; margin: clamp(1.5rem, 5vw, 2.25rem) auto 0;
    padding: 32px; border: 1px solid var(--teal); border-radius: 4px;
    background: linear-gradient(160deg, rgba(212,181,106,.06), transparent 40%) var(--paper);
    box-shadow:
      0 1px 1px color-mix(in srgb, var(--teal-dark) 6%, transparent),
      0 12px 28px -10px color-mix(in srgb, var(--teal-dark) 16%, transparent),
      0 32px 64px -24px color-mix(in srgb, var(--teal-dark) 18%, transparent);
  }

  .countdown { display: flex; gap: 0; margin-bottom: 1.4rem; border-top: 1px solid color-mix(in srgb, var(--teal) 25%, var(--line)); border-bottom: 1px solid color-mix(in srgb, var(--teal) 25%, var(--line)); padding: .85rem 0; }
  .countdown-unit { flex: 1; text-align: center; border-right: 1px solid color-mix(in srgb, var(--teal) 18%, var(--line)); }
  .countdown-unit:last-child { border-right: none; }
  .countdown-num { display: block; font-family: var(--display-font); font-weight: 700; font-size: 1.35rem; color: var(--teal-dark); }
  .countdown-label { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  .card-subtitle { margin: 0 0 1.75rem; color: var(--muted); font-size: .9rem; line-height: 1.6; max-width: 42ch; }

  .field { margin-bottom: 1.25rem; }
  .field label { display: block; margin-bottom: .45rem; font: 600 .78rem "Jost", sans-serif; color: var(--muted); }
  .field input { width: 100%; height: 50px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.03); color: var(--ink); font: 400 .95rem "Jost", sans-serif; padding: 0 14px; }
  .field input::placeholder { color: rgba(243,234,212,.35); }
  .phone-row { display: flex; gap: .5rem; }
  .phone-row .country { flex: 0 0 84px; display: flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--line); border-radius: 12px; font-size: .82rem; color: var(--ink); }
  .phone-row input { flex: 1; min-width: 0; }

  .presence-toggle { display: flex; gap: 10px; }
  .presence-opt { flex: 1; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 .88rem "Jost", sans-serif; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .presence-opt svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.2; fill: none; }
  .presence-opt.selected { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 12%, transparent); color: var(--teal); }

  .foot { text-align: center; padding: 1.6rem 20px 2.5rem; font: 500 .74rem "Jost", sans-serif; color: var(--muted); opacity: .7; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-photo-frame">
    <div class="hero-photo-clip"></div>
    <div class="hero-frame">
      <div class="hero-corner tl"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
      <div class="hero-corner tr"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
      <div class="hero-corner bl"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
      <div class="hero-corner br"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
    </div>
    <div class="hero-seal"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.2 4.5 2.7C12 6.2 13.5 5 15.5 5 19 5 21.5 8.5 19.5 12.5 17 16.65 12 21 12 21z"/></svg></div>
  </div>
  <p class="hero-eyebrow" id="eyebrow"></p>
  <h1 class="hero-title" id="title"></h1>
  <p class="hero-date" id="date"></p>
</div>

<div class="card">
  <div class="countdown">
    <div class="countdown-unit"><span class="countdown-num">48</span><span class="countdown-label" id="cd-days"></span></div>
    <div class="countdown-unit"><span class="countdown-num">07</span><span class="countdown-label" id="cd-hours"></span></div>
    <div class="countdown-unit"><span class="countdown-num">23</span><span class="countdown-label" id="cd-min"></span></div>
  </div>
  <p class="card-subtitle" id="subtitle"></p>
  <div class="field"><label id="label-name"></label><input type="text" tabindex="-1"></div>
  <div class="field">
    <label id="label-phone"></label>
    <div class="phone-row"><span class="country">🇧🇷 +55</span><input type="tel" placeholder="(00) 00000-0000" tabindex="-1"></div>
  </div>
  <div class="field">
    <label id="label-presence"></label>
    <div class="presence-toggle">
      <div class="presence-opt selected" id="opt-yes"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span id="opt-yes-text"></span></div>
      <div class="presence-opt" id="opt-no"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span id="opt-no-text"></span></div>
    </div>
  </div>
</div>

<p class="foot" id="foot"></p>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var lang = qs.get('lang') === 'en' ? 'en' : 'pt';
  var STR = {
    pt: {
      eyebrow: "Você foi convidado", title: "Júlia & Marcos", date: "Sábado, 26 de setembro de 2026",
      subtitle: "Preencha seus dados para confirmar presença.",
      name: "Nome completo", phone: "Telefone", presence: "Você vai comparecer?",
      yes: "Vou comparecer", no: "Não vou poder ir",
      days: "dias", hours: "hrs", min: "min",
      foot: "Planne · Convite Digital"
    },
    en: {
      eyebrow: "You're invited", title: "Sarah & James", date: "Saturday, September 26, 2026",
      subtitle: "Fill in your details to confirm your presence.",
      name: "Full name", phone: "Phone", presence: "Will you attend?",
      yes: "I'll be there", no: "Can't make it",
      days: "days", hours: "hrs", min: "min",
      foot: "Planne · Digital Invitation"
    }
  }[lang];
  var set = function (id, value) { document.getElementById(id).textContent = value; };
  set('eyebrow', qs.get('eyebrow') || STR.eyebrow);
  set('title', qs.get('title') || STR.title);
  set('date', qs.get('date') || STR.date);
  set('subtitle', STR.subtitle);
  set('label-name', STR.name);
  set('label-phone', STR.phone);
  set('label-presence', STR.presence);
  set('opt-yes-text', STR.yes);
  set('opt-no-text', STR.no);
  set('cd-days', STR.days);
  set('cd-hours', STR.hours);
  set('cd-min', STR.min);
  set('foot', STR.foot);
})();
</script>
</body>
</html>
