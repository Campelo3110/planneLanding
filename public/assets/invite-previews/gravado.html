<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planne — Convite digital, Cartão Gravado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bonheur+Royale&family=Italiana&family=Jost:wght@400;500&display=swap">
<style>
  :root {
    --gold: #d4b56a; --gold-soft: #ecd9a8; --emerald: #0e2b25; --emerald-deep: #081a16;
    --ink: #f3ead4; --muted: #b9ab8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--ink); font-family: "Jost", sans-serif;
    background:
      radial-gradient(ellipse 90% 60% at 50% 0%, #163a32 0%, var(--emerald) 55%, var(--emerald-deep) 100%);
    display: flex; align-items: flex-start; justify-content: center; padding: 30px 14px;
  }

  .card {
    position: relative; max-width: 440px; width: 100%;
    background: linear-gradient(160deg, #0f2e27, #0a1f1a);
    border-radius: 4px; padding: 3px;
  }
  .card-inner {
    position: relative; border: 1px solid var(--gold); border-radius: 3px; padding: 48px 34px 40px;
    background: linear-gradient(160deg, rgba(212,181,106,.05), transparent 40%);
  }
  .frame { position: absolute; inset: 10px; border: 1px solid rgba(212,181,106,.4); border-radius: 2px; pointer-events: none; }
  .corner { position: absolute; width: 26px; height: 26px; }
  .corner svg { width: 100%; height: 100%; stroke: var(--gold); fill: none; stroke-width: 1.2; }
  .corner.tl { top: 4px; left: 4px; }
  .corner.tr { top: 4px; right: 4px; transform: scaleX(-1); }
  .corner.bl { bottom: 4px; left: 4px; transform: scaleY(-1); }
  .corner.br { bottom: 4px; right: 4px; transform: scale(-1,-1); }

  .seal {
    width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 1.4rem; position: relative;
    background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, #a9822f 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(212,181,106,.35);
  }
  .seal svg { width: 22px; height: 22px; stroke: var(--emerald-deep); stroke-width: 2; fill: none; }

  .content { text-align: center; position: relative; z-index: 1; }
  .eyebrow { font: 400 .68rem "Italiana"; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin: 0 0 1.2rem; }
  .title { font-family: "Bonheur Royale", cursive; font-size: clamp(2.8rem, 12vw, 3.6rem); color: var(--gold-soft); margin: 0; line-height: 1.05; }
  .amp { display: block; font-size: .55em; color: var(--gold); margin: .1em 0; }
  .rule {
    width: 90px; height: 1px; margin: 1.3rem auto; position: relative;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
  }
  .rule::before { content: "❦"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-55%); font-size: .85rem; color: var(--gold); background: #0a1f1a; padding: 0 8px; }
  .meta { font: 400 .88rem "Jost"; color: var(--ink); margin: 0 0 .3rem; letter-spacing: .03em; }
  .meta.sub { color: var(--muted); font-size: .8rem; margin-bottom: 2rem; }

  .fields { text-align: left; margin-top: 1rem; }
  .field { margin-bottom: 1.2rem; }
  .field label { display: block; font: 500 .7rem "Jost"; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
  .field input, .field select {
    width: 100%; height: 46px; border: 1px solid rgba(212,181,106,.3); border-radius: 2px; background: rgba(255,255,255,.03);
    font: 400 .9rem "Jost"; color: var(--ink); padding: 0 12px; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--gold); }
  .field input::placeholder { color: rgba(243,234,212,.35); }

  .presence { display: flex; gap: 8px; }
  .presence button {
    flex: 1; height: 46px; border: 1px solid rgba(212,181,106,.3); background: transparent; color: var(--muted);
    font: 500 .8rem "Jost"; cursor: pointer;
  }
  .presence button.active { border-color: var(--gold); background: rgba(212,181,106,.12); color: var(--gold-soft); }

  .btn {
    display: block; width: 100%; height: 52px; margin-top: 1.8rem; border: 1px solid var(--gold);
    background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: var(--emerald-deep);
    font: 600 .78rem "Jost"; letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
  }
  .foot { text-align: center; margin-top: 1.6rem; font: 400 .68rem "Jost"; color: var(--muted); letter-spacing: .05em; }
</style>
</head>
<body>
<div class="card">
  <div class="card-inner">
    <div class="frame"></div>
    <div class="corner tl"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
    <div class="corner tr"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
    <div class="corner bl"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
    <div class="corner br"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>

    <div class="content">
      <div class="seal"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.2 4.5 2.7C12 6.2 13.5 5 15.5 5 19 5 21.5 8.5 19.5 12.5 17 16.65 12 21 12 21z"/></svg></div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 class="title" id="title"></h1>
      <div class="rule"></div>
      <p class="meta" id="date"></p>
      <p class="meta sub" id="venue"></p>

      <div class="fields">
        <div class="field"><label id="label-name"></label><input type="text" tabindex="-1"></div>
        <div class="field"><label id="label-phone"></label><input type="tel" placeholder="(00) 00000-0000" tabindex="-1"></div>
        <div class="field">
          <label id="label-presence"></label>
          <div class="presence">
            <button class="active" id="btn-yes" tabindex="-1"></button>
            <button id="btn-no" tabindex="-1"></button>
          </div>
        </div>
        <button class="btn" id="btn-submit" tabindex="-1"></button>
      </div>
    </div>
  </div>
</div>
<p class="foot" id="foot" style="position:absolute; bottom:20px; width:100%; text-align:center;"></p>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var lang = qs.get('lang') === 'en' ? 'en' : 'pt';
  var STR = {
    pt: {
      eyebrow: "Você foi convidado", title: "Júlia & Marcos",
      date: "Sábado, 26 de Setembro de 2026", venue: "Salão de Festas · Ponta Negra · 19h00",
      name: "Nome completo", phone: "Telefone", presence: "Presença",
      yes: "Vou comparecer", no: "Não vou poder ir", submit: "Confirmar Presença",
      foot: "Planne · Convite Digital"
    },
    en: {
      eyebrow: "You're invited", title: "Sarah & James",
      date: "Saturday, September 26, 2026", venue: "The Harborview Estate · 7:00 PM",
      name: "Full name", phone: "Phone", presence: "Attending",
      yes: "I'll be there", no: "Can't make it", submit: "Confirm Attendance",
      foot: "Planne · Digital Invitation"
    }
  }[lang];
  var set = function (id, value) { document.getElementById(id).textContent = value; };

  var titleRaw = qs.get('title') || STR.title;
  var titleEl = document.getElementById('title');
  titleEl.textContent = '';
  if (titleRaw.indexOf(' & ') !== -1) {
    var parts = titleRaw.split(' & ');
    titleEl.appendChild(document.createTextNode(parts[0]));
    var amp = document.createElement('span');
    amp.className = 'amp';
    amp.textContent = '&';
    titleEl.appendChild(amp);
    titleEl.appendChild(document.createTextNode(parts.slice(1).join(' & ')));
  } else {
    titleEl.appendChild(document.createTextNode(titleRaw));
  }

  set('eyebrow', qs.get('eyebrow') || STR.eyebrow);
  set('date', qs.get('date') || STR.date);
  set('venue', qs.get('venue') || STR.venue);
  set('label-name', STR.name);
  set('label-phone', STR.phone);
  set('label-presence', STR.presence);
  set('btn-yes', STR.yes);
  set('btn-no', STR.no);
  set('btn-submit', STR.submit);
  set('foot', STR.foot);
})();
</script>
</body>
</html>
