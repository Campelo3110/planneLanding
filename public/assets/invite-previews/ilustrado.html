<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planne — Convite digital, Ilustrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bonheur+Royale&family=Quicksand:wght@500;600;700&display=swap">
<style>
  :root {
    --rose: #c9748a; --rose-dark: #8a4258; --sage: #8fa683; --gold: #c9a24b;
    --paper: #fdf6f2; --ink: #5b3a45; --muted: #a2828d; --line: #f0d8de;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #f3e4e8; color: var(--ink); font-family: "Quicksand", sans-serif; }

  .page { max-width: 480px; margin: 0 auto; padding: 28px 14px 60px; }

  .card {
    position: relative; background: var(--paper); border-radius: 28px; padding: 42px 30px 34px;
    box-shadow: 0 20px 50px -20px rgba(139,66,88,.35);
    overflow: hidden;
  }
  .card::before, .card::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(18px); opacity: .55; pointer-events: none;
  }
  .card::before { width: 180px; height: 180px; top: -70px; left: -60px; background: radial-gradient(circle, var(--rose) 0%, transparent 70%); }
  .card::after { width: 200px; height: 200px; bottom: -80px; right: -70px; background: radial-gradient(circle, var(--sage) 0%, transparent 70%); }

  .blossoms { position: absolute; top: 14px; left: 0; right: 0; height: 70px; z-index: 1; pointer-events: none; }
  .blossom { position: absolute; }
  .petal { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(45deg); position: absolute; }

  .content { position: relative; z-index: 2; text-align: center; }
  .eyebrow { font: 700 .68rem "Quicksand"; letter-spacing: .18em; text-transform: uppercase; color: var(--rose-dark); margin: 0 0 .6rem; }
  .title { font-family: "Bonheur Royale", cursive; font-size: clamp(3rem, 14vw, 4rem); color: var(--rose-dark); margin: 0 0 .3rem; line-height: 1.1; }
  .subtitle { font: 500 .85rem "Quicksand"; color: var(--muted); margin: 0 0 1.6rem; }

  .icon-row { display: flex; justify-content: center; gap: 14px; margin-bottom: 1.8rem; }
  .icon-pill { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px; }
  .icon-circle {
    width: 52px; height: 52px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px -6px rgba(139,66,88,.3);
  }
  .icon-circle svg { width: 22px; height: 22px; stroke: var(--rose-dark); fill: none; stroke-width: 2; }
  .icon-label { font: 600 .62rem "Quicksand"; color: var(--ink); text-align: center; line-height: 1.2; }

  .divider { display: flex; align-items: center; gap: 10px; margin: 0 0 1.6rem; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .divider svg { width: 16px; height: 16px; fill: var(--rose); }

  .fields { text-align: left; }
  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font: 700 .72rem "Quicksand"; color: var(--rose-dark); margin-bottom: .4rem; }
  .field input, .field select {
    width: 100%; height: 48px; border: 2px solid var(--line); border-radius: 16px; background: #fff;
    font: 500 .9rem "Quicksand"; color: var(--ink); padding: 0 14px; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--rose); }

  .presence { display: flex; gap: 10px; }
  .presence button {
    flex: 1; height: 48px; border-radius: 16px; border: 2px solid var(--line); background: #fff;
    font: 700 .82rem "Quicksand"; color: var(--muted); cursor: pointer;
  }
  .presence button.active { border-color: var(--rose); background: #fdeef1; color: var(--rose-dark); }

  .btn {
    display: block; width: 100%; height: 54px; margin-top: 1.6rem; border: none; border-radius: 18px;
    background: linear-gradient(135deg, var(--rose), var(--rose-dark)); color: #fff;
    font: 700 .9rem "Quicksand"; letter-spacing: .02em; cursor: pointer;
    box-shadow: 0 12px 24px -8px rgba(139,66,88,.5);
  }

  .foot { text-align: center; padding-top: 1.8rem; font: 600 .7rem "Quicksand"; color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="blossoms">
      <div class="blossom" style="left:12%; top:4px;">
        <div class="petal" style="background:var(--rose); left:0; top:0;"></div>
        <div class="petal" style="background:var(--rose); left:10px; top:-4px; transform:rotate(135deg);"></div>
        <div class="petal" style="background:var(--gold); left:5px; top:8px; transform:rotate(0deg); width:14px; height:14px;"></div>
      </div>
      <div class="blossom" style="right:14%; top:12px;">
        <div class="petal" style="background:var(--sage); left:0; top:0; width:16px; height:16px;"></div>
        <div class="petal" style="background:var(--rose); left:8px; top:6px; transform:rotate(90deg); width:18px; height:18px;"></div>
      </div>
    </div>
    <div class="content">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 class="title" id="title"></h1>
      <p class="subtitle" id="subtitle"></p>

      <div class="icon-row">
        <div class="icon-pill">
          <div class="icon-circle"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
          <span class="icon-label" id="icon-agenda"></span>
        </div>
        <div class="icon-pill">
          <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M12 21s-7-5-7-11a7 7 0 0 1 14 0c0 6-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
          <span class="icon-label" id="icon-local"></span>
        </div>
        <div class="icon-pill">
          <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
          <span class="icon-label" id="icon-whatsapp"></span>
        </div>
      </div>

      <div class="divider"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.2 4.5 2.7C12 6.2 13.5 5 15.5 5 19 5 21.5 8.5 19.5 12.5 17 16.65 12 21 12 21z"/></svg></div>

      <div class="fields">
        <div class="field"><label id="label-name"></label><input type="text" tabindex="-1"></div>
        <div class="field"><label id="label-phone"></label><input type="tel" placeholder="(00) 00000-0000" tabindex="-1"></div>
        <div class="field">
          <label id="label-presence"></label>
          <div class="presence">
            <button class="active" id="btn-yes" tabindex="-1"></button>
            <button id="btn-no" tabindex="-1"></button>
          </div>
        </div>
        <button class="btn" id="btn-submit" tabindex="-1"></button>
      </div>
    </div>
  </div>
  <p class="foot" id="foot"></p>
</div>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var lang = qs.get('lang') === 'en' ? 'en' : 'pt';
  var STR = {
    pt: {
      eyebrow: "Você foi convidado", title: "Júlia & Marcos", subtitle: "Sábado, 26 de Setembro · 19h00",
      agenda: "Adicionar\nagenda", local: "Ver\nlocal", whatsapp: "Falar no\nWhatsApp",
      name: "Nome completo", phone: "Telefone", presence: "Você vai comparecer?",
      yes: "Vou comparecer", no: "Não vou poder ir", submit: "Confirmar presença 💌",
      foot: "Planne · Convite Digital"
    },
    en: {
      eyebrow: "You're invited", title: "Sarah & James", subtitle: "Saturday, September 26 · 7:00 PM",
      agenda: "Add to\ncalendar", local: "View\nvenue", whatsapp: "Message on\nWhatsApp",
      name: "Full name", phone: "Phone", presence: "Will you attend?",
      yes: "I'll be there", no: "Can't make it", submit: "Confirm attendance 💌",
      foot: "Planne · Digital Invitation"
    }
  }[lang];
  var set = function (id, value) { document.getElementById(id).textContent = value; };
  var setBr = function (id, value) {
    var el = document.getElementById(id);
    el.textContent = '';
    value.split('\n').forEach(function (line, i) {
      if (i > 0) el.appendChild(document.createElement('br'));
      el.appendChild(document.createTextNode(line));
    });
  };
  set('eyebrow', qs.get('eyebrow') || STR.eyebrow);
  set('title', qs.get('title') || STR.title);
  set('subtitle', qs.get('date') || STR.subtitle);
  setBr('icon-agenda', STR.agenda);
  setBr('icon-local', STR.local);
  setBr('icon-whatsapp', STR.whatsapp);
  set('label-name', STR.name);
  set('label-phone', STR.phone);
  set('label-presence', STR.presence);
  set('btn-yes', STR.yes);
  set('btn-no', STR.no);
  set('btn-submit', STR.submit);
  set('foot', STR.foot);
})();
</script>
</body>
</html>
