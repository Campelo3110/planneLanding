<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planne - RSVP</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f8fafc">
    <script>
      // Links compartilhados pela versão 3.0.0 mantêm o mesmo token. A nova
      // página resolve esse token e grava as respostas na mesma estrutura.
      // `replace` evita que o convidado volte sem querer à página legada.
      (function () {
        var next = new URL('/rsvp-v2.html', window.location.origin);
        next.search = window.location.search;
        next.hash = window.location.hash;
        window.location.replace(next.href);
      }());
    </script>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('planne-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

    
    <script type="module" src="/assets/js/app-check.js"></script>
    <link rel="stylesheet" href="/assets/css/rsvp.css">
<link rel="stylesheet" href="/assets/css/utility-pages.css">
<!-- fontes dos 3 estilos de convite (rsvpTemplateId) — "Planne Inter"
         (default) continua vindo do app, essas são só as adicionais de
         cada estilo. Carregadas sempre (só 3 combinações, leve o
         suficiente) em vez de injeção dinâmica por JS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&family=Bonheur+Royale&family=Quicksand:wght@500;600;700&family=Italiana&display=swap">

    <link rel="stylesheet" href="/assets/css/rsvp-templates.css">
</head>

<body>

<header class="invite-header">
    <a class="utility-brand" href="/pt-br" aria-label="Planne">
        <img src="/assets/brand/logo-64x64.png" alt="" width="36" height="36">
        <span>Planne</span>
    </a>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" stroke-width="1.8" fill="none">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/>
        </svg>
    </button>
</header>

<!-- Aviso não-bloqueante: aparece só se o reCAPTCHA/App Check falhar ao
     carregar (ad blocker, extensão de privacidade, etc.) — não impede o
     convidado de confirmar presença, só avisa. Ver window.__getAppCheckToken
     no módulo App Check carregado no cabeçalho. -->
<div style="max-width:560px;margin:0 auto;padding:0 20px;box-sizing:border-box;">
    <div class="msg msg-error" id="appCheckWarning" role="alert">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="appCheckWarningText"></span>
    </div>
</div>

<!-- CAPA — retrato emoldurado (rsvpCoverImageUrl), não mais full-bleed
     com texto por cima (ilegível dependendo da foto). Título/data ficam
     ABAIXO da moldura, em texto sólido normal da página.
     data-invite-style (foto-editorial|ilustrado|gravado) decide a identidade
     visual (fonte/cor/decoração/formato da moldura) em cima desta MESMA
     estrutura — nenhum estilo muda a ordem ou a existência das seções. -->
<div class="hero" id="coverHero">
    <div class="hero-photo-frame">
        <!-- decoração "ilustrado": manchas de aquarela atrás do retrato (só visíveis nesse estilo, com foto) -->
        <div class="hero-blossoms" aria-hidden="true"></div>
        <div class="hero-photo-clip">
            <img class="hero-photo" id="coverPhoto" alt="">
        </div>
        <!-- decoração "gravado": moldura dourada gravada no retrato (só visível nesse estilo, com foto) -->
        <div class="hero-frame" aria-hidden="true">
            <div class="hero-corner tl"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
            <div class="hero-corner tr"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
            <div class="hero-corner bl"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
            <div class="hero-corner br"><svg viewBox="0 0 26 26"><path d="M2 24 C2 10 10 2 24 2"/><path d="M2 18 C2 9 9 2 18 2" opacity=".5"/></svg></div>
        </div>
        <!-- selo de cera "gravado" — carimbado na borda do retrato quando há foto,
             solto e centralizado (via CSS) quando não há. -->
        <div class="hero-seal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.2 4.5 2.7C12 6.2 13.5 5 15.5 5 19 5 21.5 8.5 19.5 12.5 17 16.65 12 21 12 21z"/></svg></div>
    </div>
    <div class="hero-content">
        <p class="hero-eyebrow" id="heroEyebrow" data-i18n="invitedEyebrow"></p>
        <h1 class="hero-title" id="heroEventTitle"></h1>
        <p class="hero-date" id="heroEventDate" hidden></p>
    </div>
</div>

<main class="utility-main">
<div class="card" aria-live="polite">

    <!-- contagem regressiva + dress code/FAQ (só aparecem se o organizador preencheu) -->
    <div class="card-blocks" id="cardBlocks">
        <div class="countdown" id="countdown" hidden>
            <div class="countdown-unit"><span class="countdown-num" id="cdDays">0</span><span class="countdown-label" data-i18n="cdDays"></span></div>
            <div class="countdown-unit"><span class="countdown-num" id="cdHours">0</span><span class="countdown-label" data-i18n="cdHours"></span></div>
            <div class="countdown-unit"><span class="countdown-num" id="cdMinutes">0</span><span class="countdown-label" data-i18n="cdMinutes"></span></div>
        </div>

        <details class="event-details" id="eventDetails" hidden>
            <summary>
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                <span data-i18n="eventDetailsToggle"></span>
            </summary>
            <div class="event-detail-blocks" id="eventDetailBlocks">
                <div class="event-detail-block" id="dressCodeBlock" hidden>
                    <div class="event-detail-block-title" data-i18n="dressCodeLabel"></div>
                    <div class="event-detail-block-body" id="dressCodeBody"></div>
                </div>
                <div class="event-detail-block" id="faqBlock" hidden>
                    <div class="event-detail-block-title" data-i18n="faqLabel"></div>
                    <div class="event-detail-block-body" id="faqBody"></div>
                </div>
            </div>
        </details>
    </div>

    <!-- LOADING (resolve token) -->
    <div class="state active" id="stateLoading">
        <div class="loading-pulse">
            <div class="pulse-ring"></div>
            <p data-i18n="loading"></p>
        </div>
    </div>

    <!-- INVALID TOKEN / DISABLED -->
    <div class="state" id="stateInvalid">
        <div class="state-icon icon-error">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <p class="state-title" data-i18n="invalidTitle"></p>
        <p class="state-sub" data-i18n="invalidSub"></p>
    </div>

    <!-- MODO PÚBLICO — formulário de autocadastro -->
    <div class="state" id="statePublicForm">
        <div class="card-icon">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <p class="card-subtitle" id="publicSubtitleText"></p>

        <div class="msg msg-error" id="publicError" role="alert">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="publicErrorText"></span>
        </div>

        <div class="field">
            <label for="pubName" data-i18n="labelName"></label>
            <input type="text" id="pubName" autocomplete="name" maxlength="120">
        </div>
        <div class="field">
            <label for="pubPhone" data-i18n="labelPhone"></label>
            <div class="phone-row">
                <select id="pubPhoneCountry" aria-label="Country code"></select>
                <input type="tel" id="pubPhone" autocomplete="tel" data-i18n-placeholder="placeholderPhone" maxlength="20">
            </div>
        </div>
        <div class="field">
            <label data-i18n="labelPresence"></label>
            <div class="presence-toggle" id="pubPresenceToggle">
                <button type="button" class="presence-opt" id="pubYes" onclick="setPresence('pub', true)">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                    <span data-i18n="presenceYes"></span>
                </button>
                <button type="button" class="presence-opt" id="pubNo" onclick="setPresence('pub', false)">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    <span data-i18n="presenceNo"></span>
                </button>
            </div>
        </div>
        <div class="field companions-field" id="pubCompanionsField">
            <label for="pubCompanions" data-i18n="labelCompanions"></label>
            <div class="stepper">
                <button type="button" class="stepper-btn" data-step="-1" data-target="pubCompanions" aria-label="−">−</button>
                <input type="text" inputmode="numeric" id="pubCompanions" value="0" readonly>
                <button type="button" class="stepper-btn" data-step="1" data-target="pubCompanions" aria-label="+">+</button>
            </div>
            <div class="companion-names" id="pubCompanionNames"></div>
        </div>
        <div class="field">
            <label for="pubMenu" data-i18n="labelMenu"></label>
            <select id="pubMenu">
                <option value="1" data-i18n="menuRegular"></option>
                <option value="2" data-i18n="menuVegetarian"></option>
                <option value="3" data-i18n="menuVegan"></option>
                <option value="4" data-i18n="menuKids"></option>
                <option value="5" data-i18n="menuGlutenFree"></option>
                <option value="6" data-i18n="menuLactoseFree"></option>
                <option value="7" data-i18n="menuOther"></option>
            </select>
        </div>

        <button class="btn-primary" id="pubSubmitBtn" onclick="submitPublic()">
            <div class="spinner" id="pubSpinner"></div>
            <span data-i18n="btnSend"></span>
        </button>
    </div>

    <!-- MODO PRIVADO — passo 1: buscar nome -->
    <div class="state" id="statePrivateSearch">
        <div class="step-track" aria-hidden="true"><span class="step-dot active"></span><span class="step-dot"></span></div>
        <div class="card-icon">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <h1 class="card-title" data-i18n="privateSearchTitle"></h1>
        <p class="card-subtitle" data-i18n="privateSearchSubtitle"></p>

        <div class="msg msg-error" id="searchError" role="alert">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="searchErrorText"></span>
        </div>

        <div class="field">
            <label for="searchName" data-i18n="labelName"></label>
            <input type="text" id="searchName" autocomplete="name" maxlength="120">
        </div>

        <button class="btn-primary" id="searchBtn" onclick="lookupGuest()">
            <div class="spinner" id="searchSpinner"></div>
            <span data-i18n="btnSearch"></span>
        </button>
    </div>

    <!-- MODO PRIVADO — passo 2: confirmar telefone + responder -->
    <div class="state" id="statePrivateConfirm">
        <div class="step-track" aria-hidden="true"><span class="step-dot done"></span><span class="step-dot active"></span></div>
        <div class="card-icon">
            <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        </div>
        <h1 class="card-title" data-i18n="privateConfirmTitle"></h1>
        <p class="private-greeting" id="privateGreeting" hidden></p>
        <p class="card-subtitle" id="privateConfirmSubtitle"></p>

        <div class="msg msg-error" id="confirmError" role="alert">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="confirmErrorText"></span>
        </div>

        <div class="field">
            <label id="phoneLast4Label" data-i18n="labelPhoneLast4"></label>
            <div class="otp-group" role="group" aria-labelledby="phoneLast4Label">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 1">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 2">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 3">
                <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 4">
            </div>
            <input type="hidden" id="phoneLast4">
        </div>
        <div class="field">
            <label data-i18n="labelPresence"></label>
            <div class="presence-toggle" id="privPresenceToggle">
                <button type="button" class="presence-opt" id="privYes" onclick="setPresence('priv', true)">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                    <span data-i18n="presenceYes"></span>
                </button>
                <button type="button" class="presence-opt" id="privNo" onclick="setPresence('priv', false)">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    <span data-i18n="presenceNo"></span>
                </button>
            </div>
        </div>
        <div class="field companions-field" id="privCompanionsField">
            <label for="privCompanions" data-i18n="labelCompanions"></label>
            <div class="stepper">
                <button type="button" class="stepper-btn" data-step="-1" data-target="privCompanions" aria-label="−">−</button>
                <input type="text" inputmode="numeric" id="privCompanions" value="0" readonly>
                <button type="button" class="stepper-btn" data-step="1" data-target="privCompanions" aria-label="+">+</button>
            </div>
            <div class="companion-names" id="privCompanionNames"></div>
        </div>
        <div class="field">
            <label for="privMenu" data-i18n="labelMenu"></label>
            <select id="privMenu">
                <option value="1" data-i18n="menuRegular"></option>
                <option value="2" data-i18n="menuVegetarian"></option>
                <option value="3" data-i18n="menuVegan"></option>
                <option value="4" data-i18n="menuKids"></option>
                <option value="5" data-i18n="menuGlutenFree"></option>
                <option value="6" data-i18n="menuLactoseFree"></option>
                <option value="7" data-i18n="menuOther"></option>
            </select>
        </div>

        <button class="btn-primary" id="confirmBtn" onclick="submitPrivate()">
            <div class="spinner" id="confirmSpinner"></div>
            <span data-i18n="btnSend"></span>
        </button>
    </div>

    <!-- SUCESSO -->
    <div class="state" id="stateSuccess">
        <div class="seal" id="successIcon">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="state-title" id="successTitle"></p>
        <p class="state-sub" id="successSub"></p>
        <div class="calendar-wrap">
            <button class="btn-calendar" id="btnAddCalendar" hidden onclick="onAddCalendarClick()">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span data-i18n="btnAddCalendar"></span>
            </button>
            <div class="calendar-menu" id="calendarMenu" hidden>
                <a class="calendar-menu-item" id="calendarMenuGoogle" target="_blank" rel="noopener" onclick="closeCalendarMenu()">
                    <span data-i18n="btnAddCalendarGoogle"></span>
                </a>
                <a class="calendar-menu-item" id="calendarMenuOutlook" target="_blank" rel="noopener" onclick="closeCalendarMenu()">
                    <span data-i18n="btnAddCalendarOutlook"></span>
                </a>
                <button type="button" class="calendar-menu-item" id="calendarMenuIcs" onclick="downloadIcs()">
                    <span data-i18n="btnAddCalendarIcs"></span>
                </button>
            </div>
        </div>
        <button type="button" class="rsvp-another" id="btnAddAnother" hidden onclick="startAnotherPublicRsvp()">
            <span data-i18n="btnAddAnother"></span>
        </button>
        <a class="btn-referral" id="btnCreateOwnEvent" href="#" target="_blank" rel="noopener" hidden>
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="btnCreateOwnEvent"></span>
        </a>
    </div>

</div>

<!-- MAPA (rsvpLocationInfo) -->
<div class="map-section" id="mapSection" hidden>
    <div class="section-heading">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span data-i18n="locationInfoLabel"></span>
    </div>
    <div class="map-address-text" id="mapAddressText"></div>
    <div class="map-embed">
        <iframe id="mapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa do local"></iframe>
    </div>
</div>

<!-- MENSAGEM DO ORGANIZADOR (rsvpOrganizerMessage) -->
<div class="organizer-message" id="organizerMessage" hidden>
    <div class="organizer-message-body" id="organizerMessageBody"></div>
</div>

</main>

<footer class="invite-footer">
    <span>Planne</span> · <a href="/privacy.html" data-i18n="privacy"></a>
    <span id="footerAppLinkWrap" hidden>· <a href="https://play.google.com/store/apps/details?id=com.planne.planne" id="footerAppLink" target="_blank" rel="noopener" data-i18n="footerCreateEvent"></a></span>
</footer>

<script src="/assets/js/rsvp.js"></script>
</body>
</html>
